[package]
name = "rwa-launchpad-dia-3"
version = "1.0.0"
edition = "2024"
publish = true

[lib]
crate-type = ["cdylib"]
doctest = true

[dependencies]
soroban-sdk = "25"

[dev-dependencies]
soroban-sdk = { version = "25", features = ["testutils"] }

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[profile.release-with-logs]
inherits = "release"
debug-assertions = true
